<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Fyla File Manager</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            flex: 0 0 auto;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #ddd;
            margin-top: 0; /* optional: can be adjusted later if needed */
        }


        #pathInput {
            flex: 1;
            padding: .35rem .5rem;
        }

        #list {
            padding: .5rem .75rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid #eee;
            padding: .4rem .3rem;
            text-align: left;
        }

        tfoot td {
            font-weight: 600;
        }

        .click {
            color: #0366d6;
            cursor: pointer;
            text-decoration: underline;
        }

        .toolbar {
            display: flex;
            gap: .5rem;
        }

        .subpath {
            font-size: 0.8em;
            color: #666;
            margin-top: 2px;
            user-select: text;
        }

        .spinner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

            .spinner.hidden {
                display: none;
            }

        .loader {
            border: 6px solid #ccc;
            border-top: 6px solid #0078d7;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 1000px;
            height: 90%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        #list {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 10px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.25rem 0;
            border-bottom: 1px solid #ddd;
        }

            .list-header h3 {
                margin: 0;
                font-size: 1.1rem;
            }

        .stats {
            font-size: 0.9rem;
            color: #666;
            white-space: nowrap;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: #f3f3f3;
            border: 1px solid #ccc;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 18px;
            line-height: 24px;
            text-align: center;
            cursor: pointer;
            z-index: 10;
        }

        .close-btn:hover {
            background: #e0e0e0;
        }

    </style>
</head>
<body>
    <button id="openBrowserBtn">Open Fyla File Browser</button>

    <div id="fileBrowserModal" class="modal hidden">
        <div class="modal-content">
            <header>
                <div class="toolbar">
                    <button id="upBtn">Up</button>
                    <button id="uploadBtn">Upload</button>
                </div>
                <input id="pathInput" placeholder="Path (e.g. C:\\ or /)" />
                <input id="searchInput" placeholder="Search (wildcards or substring)" />
                <label><input id="deepCheck" type="checkbox" /> Deep</label>
                <button id="searchBtn">Search</button>
            </header>

            <div id="list"></div>
            <div id="spinner" class="spinner hidden">
                <div class="loader"></div>
            </div>
        </div>

        <button id="closeBrowserBtn" class="close-btn">✕</button>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
