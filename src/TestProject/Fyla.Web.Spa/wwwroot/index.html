<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Fyla File Manager</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
        }

        header {
            display: flex;
            gap: .5rem;
            align-items: center;
            padding: .5rem .75rem;
            border-bottom: 1px solid #ddd;
        }

        #pathInput {
            flex: 1;
            padding: .35rem .5rem;
        }

        #list {
            padding: .5rem .75rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid #eee;
            padding: .4rem .3rem;
            text-align: left;
        }

        tfoot td {
            font-weight: 600;
        }

        .click {
            color: #0366d6;
            cursor: pointer;
            text-decoration: underline;
        }

        .toolbar {
            display: flex;
            gap: .5rem;
        }

        .subpath {
            font-size: 0.8em;
            color: #666;
            margin-top: 2px;
            user-select: text;
        }

        .spinner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

            .spinner.hidden {
                display: none;
            }

        .loader {
            border: 6px solid #ccc;
            border-top: 6px solid #0078d7;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

    </style>
</head>
<body>
    <header>
        <div class="toolbar">
            <button id="upBtn">Up</button>
            <button id="uploadBtn">Upload</button>
        </div>
        <input id="pathInput" placeholder="Path (e.g. C:\ or /)" />
        <input id="searchInput" placeholder="Search (wildcards or substring)" />
        <label><input id="deepCheck" type="checkbox" /> Deep</label>
        <button id="searchBtn">Search</button>
    </header>
    <div id="list"></div>
    <div id="spinner" class="spinner hidden">
        <div class="loader"></div>
    </div>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
